services:
  - type: web
    name: chainintel-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -e .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CI_ENV
        value: production
      - key: CI_DATABASE_URL
        fromDatabase:
          name: chainintel-db
          property: connectionString
      - key: CI_ETHERSCAN_API_KEY
        sync: false          # fill manually in Render dashboard
      - key: CI_CORS_ALLOW_ALL
        value: "false"
      - key: CI_CORS_ORIGINS
        sync: false          # set to your Cloudflare Pages URL e.g. ["https://chainintel.pages.dev"]

databases:
  - name: chainintel-db
    databaseName: chainintel
    plan: free

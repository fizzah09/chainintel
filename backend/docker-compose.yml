# Local development dependencies. Bank deployments use their own managed PostgreSQL and Redis.
name: chainintel

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chainintel
      POSTGRES_PASSWORD: chainintel # development only
      POSTGRES_DB: chainintel
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chainintel -d chainintel"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
